name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Tested through uv-managed (standalone) CPython builds, independent
        # of the runner image: 3.9 = oldest supported, 3.13 = newest common.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      # Same tooling the start script uses for end users (uv + managed CPython).
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Create venv with Python ${{ matrix.python-version }}
        run: uv venv .venv --python "${{ matrix.python-version }}"
      - name: Install package + test dependencies
        run: |
          uv pip install --python .venv/bin/python --quiet .
          uv pip install --python .venv/bin/python --quiet pytest pytest-cov
      - name: Run tests
        run: |
          .venv/bin/python -m pytest --cov=smartboard_invert --cov-fail-under=80
      - name: Smoke test (CLI entry point + sample run)
        run: |
          .venv/bin/smartinvert --version
          .venv/bin/smartinvert -i inputs/test.pdf -o /tmp/inv_out/test.pdf
          test -f /tmp/inv_out/test.pdf
