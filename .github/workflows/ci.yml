name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Create venv
        run: python -m venv .venv
      - name: Install dependencies
        run: |
          .venv/bin/pip install --break-system-packages -e .
      - name: Run tests
        run: |
          .venv/bin/python -m pytest --cov=smartboard_invert --cov-fail-under=80
