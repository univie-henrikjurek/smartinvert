[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartboard-invert"
version = "0.2.0"
description = "Selective smartboard inversion for PDFs (auto rectangle detection, CLI + simple GUI)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Henrik Jurek", email = "243551298+univie-henrikjurek@users.noreply.github.com"},
]
dependencies = [
    "PyMuPDF>=1.23.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=9.0.0",
]

[project.scripts]
smartboard-invert = "smartboard_invert.cli:main"

[tool.coverage.run]
# GUI is headless-only (needs a display) and __main__ is a thin entry-point
# wrapper exercised through the CLI tests; both are excluded from the
# 80% core-coverage gate.
omit = [
    "smartboard_invert/gui.py",
    "smartboard_invert/__main__.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]