[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartboard-invert"
version = "0.1.0"
description = "PDF whiteboard inversion tool (CLI + simple GUI)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Henrik Jurek", email = "243551298+univie-henrikjurek@users.noreply.github.com"},
]
dependencies = [
    "PyMuPDF>=1.23.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=9.0.0",
]

[project.scripts]
smartboard-invert = "smartboard_invert.cli:main"

[tool.setuptools.packages.find]
where = ["."]